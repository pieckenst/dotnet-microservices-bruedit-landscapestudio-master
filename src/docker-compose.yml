services:
  analyticsdb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo_data:/data/db

  accountdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: AccountDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:-account_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d AccountDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - account_postgres_data:/var/lib/postgresql/data

  catalogdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CatalogDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

  identitydb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: IdentityDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d IdentityDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

  projectdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ProjectDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD:-project_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d ProjectDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - project_postgres_data:/var/lib/postgresql/data

  organizationdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: OrganizationDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${ORGANIZATION_DB_PASSWORD:-organization_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d OrganizationDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - organization_postgres_data:/var/lib/postgresql/data

  procurementdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ProcurementDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${PROCUREMENT_DB_PASSWORD:-procurement_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d ProcurementDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data

  organization.api:
    image: ${DOCKER_REGISTRY-}organizationapi
    build:
      context: .
      dockerfile: Services/Organization/Organization.API/Dockerfile
    environment:
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__OrganizationConnectionString: Host=organizationdb;Port=5432;Database=OrganizationDb;Username=landscape_app;Password=${ORGANIZATION_DB_PASSWORD:-organization_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/organization.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      rabbitmq:
        condition: service_healthy
      organizationdb:
        condition: service_healthy
    ports:
      - "8005:8080"
    volumes:
      - organization_sqlite_data:/app/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4

  mongo-express:
    image: mongo-express

  portainer:
    image: portainer/portainer-ce

  analytics.api:
    image: ${DOCKER_REGISTRY-}analyticsapi
    build:
      context: .
      dockerfile: Services/Transaction/Transaction.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DatabaseSettings__ConnectionString: mongodb://analyticsdb:27017
      DatabaseSettings__DatabaseName: LandscapeAnalytics
      DatabaseSettings__CollectionName: AuditEvents
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      analyticsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8080"

  account.api:
    image: ${DOCKER_REGISTRY-}accountapi
    build:
      context: .
      dockerfile: Services/Account/Account.API/Dockerfile
    environment:
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__AccountConnectionString: Host=accountdb;Port=5432;Database=AccountDb;Username=landscape_app;Password=${ACCOUNT_DB_PASSWORD:-account_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/account.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      rabbitmq:
        condition: service_healthy
      accountdb:
        condition: service_healthy
    ports:
      - "8004:8080"
    volumes:
      - account_sqlite_data:/app/data

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__CatalogConnectionString: Host=catalogdb;Port=5432;Database=CatalogDb;Username=landscape_app;Password=${CATALOG_DB_PASSWORD:-catalog_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/catalog.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalogdb:
        condition: service_healthy
    volumes:
      - catalog_sqlite_data:/app/data

  identity.api:
    image: ${DOCKER_REGISTRY-}identityapi
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    environment:
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__IdentityConnectionString: Host=identitydb;Port=5432;Database=IdentityDb;Username=landscape_app;Password=${IDENTITY_DB_PASSWORD:-identity_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/identity.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
      Identity__BootstrapAdmin__UserName: ${IDENTITY_ADMIN_USERNAME:-}
      Identity__BootstrapAdmin__Password: ${IDENTITY_ADMIN_PASSWORD:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identitydb:
        condition: service_healthy
    ports:
      - "8003:8080"
    volumes:
      - identity_sqlite_data:/app/data

  project.api:
    image: ${DOCKER_REGISTRY-}projectapi
    build:
      context: .
      dockerfile: Services/Project/Project.API/Dockerfile
    environment:
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      Catalog__BaseUrl: http://catalog.api:8080/
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__ProjectConnectionString: Host=projectdb;Port=5432;Database=ProjectDb;Username=landscape_app;Password=${PROJECT_DB_PASSWORD:-project_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/project.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog.api:
        condition: service_started
      projectdb:
        condition: service_healthy
    ports:
      - "8001:8080"
    volumes:
      - project_sqlite_data:/app/data

  procurement.api:
    image: ${DOCKER_REGISTRY-}procurementapi
    build:
      context: .
      dockerfile: Services/Procurement/Procurement.API/Dockerfile
    environment:
      EventBusSettings__HostAddress: amqp://guest:guest@rabbitmq:5672
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__ProcurementConnectionString: Host=procurementdb;Port=5432;Database=ProcurementDb;Username=landscape_app;Password=${PROCUREMENT_DB_PASSWORD:-procurement_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/procurement.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      rabbitmq:
        condition: service_healthy
      procurementdb:
        condition: service_healthy
    ports:
      - "8006:8080"
    volumes:
      - procurement_sqlite_data:/app/data

  ocelotapigateway:
    image: ${DOCKER_REGISTRY-}ocelotapigateway
    build:
      context: .
      dockerfile: ApiGateways/OcelotApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
    depends_on:
      account.api:
        condition: service_started
      catalog.api:
        condition: service_started
      identity.api:
        condition: service_started
      project.api:
        condition: service_started
      organization.api:
        condition: service_started
      procurement.api:
        condition: service_started
      analytics.api:
        condition: service_started
    ports:
      - "8010:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.2

  kibana:
    image: docker.elastic.co/kibana/kibana:7.9.2

  webstatus:
    image: ${DOCKER_REGISTRY-}webstatus
    build:
      context: .
      dockerfile: WebApps/WebStatus/Dockerfile


  landscapestudio.web:
    image: ${DOCKER_REGISTRY-}landscapestudioweb
    build:
      context: .
      dockerfile: WebApps/LandscapeStudio.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Gateway__BaseUrl: http://ocelotapigateway:8080/
    depends_on:
      ocelotapigateway:
        condition: service_started
    ports:
      - "8008:8080"

volumes:
  mongo_data:
  portainer_data:
  postgres_data:
  pgadmin_data:
  elasticsearch-data:
  catalog_postgres_data:
  catalog_sqlite_data:
  identity_postgres_data:
  identity_sqlite_data:
  project_postgres_data:
  project_sqlite_data:
  account_postgres_data:
  account_sqlite_data:
  organization_postgres_data:
  organization_sqlite_data:
  procurement_postgres_data:
  procurement_sqlite_data:

services:
  analyticsdb:
    container_name: analyticsdb
    ports:
      - "27017:27017"

  accountdb:
    container_name: accountdb
    ports:
      - "5433:5432"

  catalogdb:
    container_name: catalogdb
    ports:
      - "5434:5432"

  identitydb:
    container_name: identitydb
    ports:
      - "5435:5432"

  projectdb:
    container_name: projectdb
    ports:
      - "5436:5432"

  organizationdb:
    container_name: organizationdb
    ports:
      - "5437:5432"

  procurementdb:
    container_name: procurementdb
    ports:
      - "5438:5432"

  rabbitmq:
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  pgadmin:
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@landscapestudio.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-this-local-password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mongo-express:
    image: mongo-express:1
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://analyticsdb:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      analyticsdb:
        condition: service_healthy
    ports:
      - "8081:8081"

  portainer:
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  elasticsearch:
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      - "5601:5601"

  webstatus:
    container_name: webstatus
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HealthChecksUI__HealthChecks__0__Name: Identity API
      HealthChecksUI__HealthChecks__0__Uri: http://identity.api:8080/health
      HealthChecksUI__HealthChecks__1__Name: Account API
      HealthChecksUI__HealthChecks__1__Uri: http://account.api:8080/health
      HealthChecksUI__HealthChecks__2__Name: Project API
      HealthChecksUI__HealthChecks__2__Uri: http://project.api:8080/health
      HealthChecksUI__HealthChecks__3__Name: Catalog API
      HealthChecksUI__HealthChecks__3__Uri: http://catalog.api:8080/health
      HealthChecksUI__HealthChecks__4__Name: Organization API
      HealthChecksUI__HealthChecks__4__Uri: http://organization.api:8080/health
      HealthChecksUI__HealthChecks__5__Name: Procurement API
      HealthChecksUI__HealthChecks__5__Uri: http://procurement.api:8080/health
      HealthChecksUI__HealthChecks__6__Name: Analytics API
      HealthChecksUI__HealthChecks__6__Uri: http://analytics.api:8080/health
    ports:
      - "8007:8080"

  landscapestudio.web:
    container_name: landscapestudio.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Gateway__BaseUrl: http://ocelotapigateway:8080/
    depends_on:
      ocelotapigateway:
        condition: service_started
    ports:
      - "8008:8080"

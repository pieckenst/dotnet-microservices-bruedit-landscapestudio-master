name: Project service CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/Services/Project/**"
      - "src/BuildingBlocks/Shared.Common/**"
      - "src/BuildingBlocks/Shared.ServiceKit/**"
      - "src/BuildingBlocks/Common.Logging/**"
      - "src/docker-compose.yml"
      - "src/ApiGateways/OcelotApiGateway/ocelot.json"
      - "src/SOLUTION.BRU.TPPO.sln"
      - ".github/workflows/project-ci.yml"
  pull_request:
    paths:
      - "src/Services/Project/**"
      - "src/BuildingBlocks/Shared.Common/**"
      - "src/BuildingBlocks/Shared.ServiceKit/**"
      - "src/BuildingBlocks/Common.Logging/**"
      - "src/docker-compose.yml"
      - "src/ApiGateways/OcelotApiGateway/ocelot.json"
      - "src/SOLUTION.BRU.TPPO.sln"
      - ".github/workflows/project-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Project API
        run: dotnet restore src/Services/Project/Project.API/Project.API.csproj
      - name: Build Project API
        run: dotnet build src/Services/Project/Project.API/Project.API.csproj --configuration Release --no-restore
      - name: Restore Project tests
        run: dotnet restore src/Tests/Project.Tests/Project.Tests.csproj
      - name: Run Project tests
        run: dotnet test src/Tests/Project.Tests/Project.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
      - name: Validate Docker Compose configuration
        run: docker compose -f src/docker-compose.yml config --quiet

name: Identity service CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/Services/Identity/**"
      - "src/BuildingBlocks/Shared.Common/**"
      - "src/BuildingBlocks/Shared.ServiceKit/**"
      - "src/BuildingBlocks/Common.Logging/**"
      - "src/docker-compose.yml"
      - "src/ApiGateways/OcelotApiGateway/ocelot.json"
      - "src/SOLUTION.BRU.TPPO.sln"
      - ".github/workflows/identity-ci.yml"
  pull_request:
    paths:
      - "src/Services/Identity/**"
      - "src/BuildingBlocks/Shared.Common/**"
      - "src/BuildingBlocks/Shared.ServiceKit/**"
      - "src/BuildingBlocks/Common.Logging/**"
      - "src/docker-compose.yml"
      - "src/ApiGateways/OcelotApiGateway/ocelot.json"
      - "src/SOLUTION.BRU.TPPO.sln"
      - ".github/workflows/identity-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Identity API
        run: dotnet restore src/Services/Identity/Identity.API/Identity.API.csproj

      - name: Build Identity API
        run: dotnet build src/Services/Identity/Identity.API/Identity.API.csproj --configuration Release --no-restore

      - name: Restore Identity tests
        run: dotnet restore src/Tests/Identity.Tests/Identity.Tests.csproj

      - name: Run Identity tests
        run: dotnet test src/Tests/Identity.Tests/Identity.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Validate Docker Compose configuration
        run: docker compose -f src/docker-compose.yml config --quiet

version: '3.4'

services:
  transactiondb:
    image: mongo

  accountdb:
    image: postgres

  customerdb:
    image: postgres

  catalogdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CatalogDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

  identitydb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: IdentityDb
      POSTGRES_USER: landscape_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscape_app -d IdentityDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine

  pgadmin:
    image: dpage/pgadmin4

  mongo-express:
    image: mongo-express

  portainer:
    image: portainer/portainer-ce

  transaction.api:
    image: ${DOCKER_REGISTRY-}transactionapi
    build:
      context: .
      dockerfile: Services/Transaction/Transaction.API/Dockerfile

  account.api:
    image: ${DOCKER_REGISTRY-}accountapi
    build:
      context: .
      dockerfile: Services/Account/Account.API/Dockerfile

  customer.api:
    image: ${DOCKER_REGISTRY-}customerapi
    build:
      context: .
      dockerfile: Services/Customer/Customer.API/Dockerfile

  customer.grpc:
    image: ${DOCKER_REGISTRY-}customergrpc
    build:
      context: .
      dockerfile: Services/Customer/Customer.GRPC/Dockerfile

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__CatalogConnectionString: Host=catalogdb;Port=5432;Database=CatalogDb;Username=landscape_app;Password=${CATALOG_DB_PASSWORD:-catalog_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/catalog.db
    depends_on:
      catalogdb:
        condition: service_healthy
    volumes:
      - catalog_sqlite_data:/app/data

  identity.api:
    image: ${DOCKER_REGISTRY-}identityapi
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__IdentityConnectionString: Host=identitydb;Port=5432;Database=IdentityDb;Username=landscape_app;Password=${IDENTITY_DB_PASSWORD:-identity_dev_only}
      ConnectionStrings__SqliteConnectionString: Data Source=/app/data/identity.db
      Jwt__Issuer: LandscapeStudio.Identity
      Jwt__Audience: LandscapeStudio.Clients
      Jwt__SigningKey: ${IDENTITY_JWT_SIGNING_KEY:-local-development-signing-key-change-before-deployment-2026}
      Identity__BootstrapAdmin__UserName: ${IDENTITY_ADMIN_USERNAME:-}
      Identity__BootstrapAdmin__Password: ${IDENTITY_ADMIN_PASSWORD:-}
    depends_on:
      identitydb:
        condition: service_healthy
    ports:
      - "8003:8080"
    volumes:
      - identity_sqlite_data:/app/data

  ocelotapigateway:
    image: ${DOCKER_REGISTRY-}ocelotapigateway
    build:
      context: .
      dockerfile: ApiGateways/OcelotApiGateway/Dockerfile

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.2

  kibana:
    image: docker.elastic.co/kibana/kibana:7.9.2

  webstatus:
    image: ${DOCKER_REGISTRY-}webstatus
    build:
      context: .
      dockerfile: WebApps/WebStatus/Dockerfile

volumes:
  mongo_data:
  portainer_data:
  postgres_data:
  pgadmin_data:
  elasticsearch-data:
  catalog_postgres_data:
  catalog_sqlite_data:
  identity_postgres_data:
  identity_sqlite_data:
